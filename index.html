<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Nono Store</title>
  <!-- استدعاء مكتبة الأيقونات FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }

    body {
      background: linear-gradient(145deg, #f7f3ed 0%, #ece5db 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .platform-hub {
      max-width: 820px;
      width: 100%;
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 3rem;
      padding: 2.5rem 2rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25),
                  inset 0 1px 2px rgba(255, 255, 255, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.7);
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 500;
      letter-spacing: -0.02em;
      color: #2e241b;
      margin-bottom: 0.25rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    h1 span {
      font-weight: 300;
      color: #6b5340;
    }

    .subhead {
      font-size: 0.95rem;
      color: #7b6a5a;
      margin-bottom: 2.25rem;
      padding-left: 0.9rem;
      border-left: 3px solid #c9b6a2;
      font-weight: 350;
    }

    .platform-grid {
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
    }

    .platform-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #ffffffd9;
      backdrop-filter: blur(4px);
      padding: 0.9rem 1.8rem 0.9rem 1.8rem;
      border-radius: 100px;
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 6px 12px -6px rgba(0, 0, 0, 0.1), 0 0 0 1px rgba(0, 0, 0, 0.02);
      transition: all 0.2s ease;
      text-decoration: none;
      color: inherit;
    }

    .platform-card:hover {
      background: #ffffff;
      box-shadow: 0 12px 20px -12px rgba(0, 0, 0, 0.25), 0 0 0 1px #c9b6a2;
      transform: scale(1.01);
    }

    .platform-name {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 1.2rem;
      font-weight: 450;
      color: #2e241b;
      letter-spacing: -0.01em;
    }

    /* تصميم الأيقونات */
    .platform-icon {
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      flex-shrink: 0;
      font-size: 1.4rem;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    }

    .platform-icon.tiktok { background: #000000; color: #ffffff; }
    .platform-icon.instagram {
      background: radial-gradient(circle at 30% 110%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%);
      color: #ffffff;
    }
    .platform-icon.facebook { background: #1877F2; color: #ffffff; }
    .platform-icon.vercel { background: #000000; color: #ffffff; font-size: 1.2rem; }

    .btn-visit {
      background: #2e241b;
      color: white;
      border: none;
      padding: 0.6rem 1.5rem;
      border-radius: 60px;
      font-size: 0.9rem;
      font-weight: 450;
      letter-spacing: 0.3px;
      cursor: pointer;
      transition: background 0.15s, box-shadow 0.15s;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      border: 1px solid #41352b;
    }

    .btn-visit:hover {
      background: #1f1813;
      box-shadow: 0 6px 12px -6px #2e241b;
    }

    .btn-visit i {
      font-size: 0.9rem;
      transition: transform 0.15s;
    }

    .btn-visit:hover i {
      transform: translateX(3px);
    }

    /* تنسيق خاص لقائمة Menu */
    .card-warning .platform-name { color: #8b5a2b; }
    .card-warning .btn-visit { background: #a0764b; border-color: #8b653f; }
    .card-warning .btn-visit:hover { background: #7e5b38; }

    .footer-note {
      margin-top: 2rem;
      font-size: 0.8rem;
      color: #9b8a7a;
      text-align: center;
      border-top: 1px dashed #d6c9bc;
      padding-top: 1.2rem;
    }
  </style>
</head>
<body>
  <div class="platform-hub">
    <h1>
      <i class="fa-solid fa-wand-magic-sparkles" style="color: #6b5340; font-size: 1.8rem;"></i> Nono Store <span style="font-weight: 300; font-size: 1.3rem;"></span>
    </h1>
    <div class="subhead">All Platforms · Click To Visit</div>

    <!-- بداية الحاوية الخاصة بكل المنصات -->
    <div class="platform-grid">
      
      <!-- TikTok -->
      <a href="https://www.tiktok.com/@nada_11773?_r=1&_t=ZS-9BI4D5W2eiy" target="_blank" rel="noopener noreferrer" class="platform-card">
        <div class="platform-name">
          <div class="platform-icon tiktok">
            <i class="fa-brands fa-tiktok"></i>
          </div>
          TikTok
        </div>
        <div class="btn-visit">
          <span>Visit</span>
          <i class="fa-solid fa-arrow-up-right-from-square"></i>
        </div>
      </a>

 <!-- Facebook -->
      <a href="https://www.facebook.com/share/g/1E4t5CFCJA/?mibextid=wwXIfr" target="_blank" rel="noopener noreferrer" class="platform-card">
        <div class="platform-name">
          <div class="platform-icon facebook">
            <i class="fa-brands fa-facebook-f"></i>
          </div>
          Facebook Group
        </div>
        <div class="btn-visit">
          <span>Visit</span>
          <i class="fa-solid fa-arrow-up-right-from-square"></i>
        </div>
      </a>
      

      <!-- Facebook -->
      <a href="https://www.facebook.com/share/1FrSk3Y9GR/?mibextid=wwXIfr" target="_blank" rel="noopener noreferrer" class="platform-card">
        <div class="platform-name">
          <div class="platform-icon facebook">
            <i class="fa-brands fa-facebook-f"></i>
          </div>
          Facebook Channel
        </div>
        <div class="btn-visit">
          <span>Visit</span>
          <i class="fa-solid fa-arrow-up-right-from-square"></i>
        </div>
      </a>
      
    </div> <!-- نهاية الحاوية -->

    <div class="footer-note">
      ⚡ TikTok · Facebook — nono store
    </div>
  </div>
</body>
</html>
